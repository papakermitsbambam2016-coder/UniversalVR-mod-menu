name: Build Chainsaw BONELAB Code Mod

on:
  workflow_dispatch:
  push:
    paths:
      - 'Chainsaw BONELAB Code Mod/**'
      - '.github/workflows/build-chainsaw-code-mod.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download Quest build references
        shell: bash
        run: |
          set -euo pipefail

          REFS='Chainsaw BONELAB Code Mod/References'
          TEMP="$RUNNER_TEMP/chainsaw-refs"
          mkdir -p "$REFS" "$TEMP/interop" "$TEMP/bonelib" "$TEMP/lemon"

          echo 'Downloading BONELAB Patch 6 pregenerated LemonLoader interop assemblies...'
          curl -L --fail --retry 3 \
            'https://raw.githubusercontent.com/LemonLoader/PregeneratedInteropData/main/831BE756BB780DFE4563CB30BAA292B54F966F108D76DB5AEEAFE64B3E6AF8335556F4EE7ED464522A978C7982EF713D99C0A7A7E8D0BD19AED7C416624196B1.zip' \
            -o "$TEMP/interop.zip"
          unzip -q "$TEMP/interop.zip" -d "$TEMP/interop"

          echo 'Downloading BoneLib 3.2.2...'
          curl -L --fail --retry 3 \
            'https://github.com/yowchap/BoneLib/releases/download/v3.2.2/BoneLib.zip' \
            -o "$TEMP/bonelib.zip"
          unzip -q "$TEMP/bonelib.zip" -d "$TEMP/bonelib"

          echo 'Downloading LemonLoader/MelonLoader build dependencies...'
          curl -L --fail --retry 3 \
            'https://github.com/LemonLoader/MelonLoader_057/releases/download/0.2.0.1/installer_deps_0.2.0.zip' \
            -o "$TEMP/lemon.zip"
          unzip -q "$TEMP/lemon.zip" -d "$TEMP/lemon"

          copy_reference() {
            local name="$1"
            local source
            source=$(find "$TEMP" -type f -name "$name" -print -quit)
            if [ -z "$source" ]; then
              echo "ERROR: Could not find $name in downloaded reference packages."
              echo 'Available DLLs:'
              find "$TEMP" -type f -iname '*.dll' -printf '%f\n' | sort -u | head -250
              exit 1
            fi
            echo "Using $source"
            cp "$source" "$REFS/$name"
          }

          copy_reference 'MelonLoader.dll'
          copy_reference 'BoneLib.dll'
          copy_reference 'Il2CppInterop.Runtime.dll'
          copy_reference 'Il2CppAssembly-CSharp.dll'
          copy_reference 'UnityEngine.CoreModule.dll'
          copy_reference 'UnityEngine.PhysicsModule.dll'
          copy_reference 'UnityEngine.AudioModule.dll'

          echo 'References ready:'
          ls -lh "$REFS"/*.dll

      - name: Build Chainsaw DLL
        run: dotnet build 'Chainsaw BONELAB Code Mod/ChainsawCodeMod.csproj' -c Release

      - name: Verify DLL
        shell: bash
        run: |
          set -euo pipefail
          DLL=$(find 'Chainsaw BONELAB Code Mod/bin/Release' -type f -name 'ChainsawBONELABCodeMod.dll' -print -quit)
          test -n "$DLL"
          echo "Built: $DLL"
          ls -lh "$DLL"

      - name: Upload Chainsaw DLL
        uses: actions/upload-artifact@v4
        with:
          name: Chainsaw-BONELAB-Code-Mod-Quest
          path: 'Chainsaw BONELAB Code Mod/bin/Release/**/ChainsawBONELABCodeMod.dll'
          if-no-files-found: error
