name: Build Chainsaw BONELAB Code Mod

on:
  workflow_dispatch:
  push:
    paths:
      - 'Chainsaw BONELAB Code Mod/**'
      - '.github/workflows/build-chainsaw-code-mod.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download Quest build references
        shell: bash
        run: |
          set -euo pipefail

          REFS='Chainsaw BONELAB Code Mod/References'
          TEMP="$RUNNER_TEMP/chainsaw-refs"
          mkdir -p "$REFS" "$TEMP/interop" "$TEMP/bonelib" "$TEMP/lemon"

          echo 'Downloading BONELAB Patch 6 pregenerated LemonLoader interop assemblies...'
          curl -L --fail --retry 3 \
            'https://raw.githubusercontent.com/LemonLoader/PregeneratedInteropData/main/831BE756BB780DFE4563CB30BAA292B54F966F108D76DB5AEEAFE64B3E6AF8335556F4EE7ED464522A978C7982EF713D99C0A7A7E8D0BD19AED7C416624196B1.zip' \
            -o "$TEMP/interop.zip"
          unzip -q "$TEMP/interop.zip" -d "$TEMP/interop"

          echo 'Downloading BoneLib 3.2.2...'
          curl -L --fail --retry 3 \
            'https://github.com/yowchap/BoneLib/releases/download/v3.2.2/BoneLib.zip' \
            -o "$TEMP/bonelib.zip"
          unzip -q "$TEMP/bonelib.zip" -d "$TEMP/bonelib"

          echo 'Downloading LemonLoader 0.6.5.1 runtime data...'
          curl -L --fail --retry 3 \
            'https://github.com/LemonLoader/MelonLoader/releases/download/0.6.5.1/melon_data.zip' \
            -o "$TEMP/lemon.zip"
          unzip -q "$TEMP/lemon.zip" -d "$TEMP/lemon"

          copy_from() {
            local source="$1"
            local dest="$2"
            if [ ! -f "$source" ]; then
              echo "ERROR: Missing expected reference: $source"
              exit 1
            fi
            echo "Using $source -> $dest"
            cp "$source" "$REFS/$dest"
          }

          copy_from "$TEMP/lemon/MelonLoader/net8/MelonLoader.dll" 'MelonLoader.dll'
          copy_from "$TEMP/bonelib/Mods/BoneLib.dll" 'BoneLib.dll'
          copy_from "$TEMP/lemon/MelonLoader/net8/Il2CppInterop.Runtime.dll" 'Il2CppInterop.Runtime.dll'
          copy_from "$TEMP/lemon/MelonLoader/net8/Il2CppInterop.Common.dll" 'Il2CppInterop.Common.dll'
          copy_from "$TEMP/interop/MelonLoader/Il2CppAssemblies/Assembly-CSharp.dll" 'Assembly-CSharp.dll'
          copy_from "$TEMP/interop/MelonLoader/Il2CppAssemblies/Il2CppSLZ.Marrow.dll" 'Il2CppSLZ.Marrow.dll'
          copy_from "$TEMP/interop/MelonLoader/Il2CppAssemblies/Il2Cppmscorlib.dll" 'Il2Cppmscorlib.dll'
          copy_from "$TEMP/interop/MelonLoader/Il2CppAssemblies/Il2CppSystem.dll" 'Il2CppSystem.dll'
          copy_from "$TEMP/interop/MelonLoader/Il2CppAssemblies/UnityEngine.dll" 'UnityEngine.dll'
          copy_from "$TEMP/interop/MelonLoader/Il2CppAssemblies/UnityEngine.CoreModule.dll" 'UnityEngine.CoreModule.dll'
          copy_from "$TEMP/interop/MelonLoader/Il2CppAssemblies/UnityEngine.PhysicsModule.dll" 'UnityEngine.PhysicsModule.dll'
          copy_from "$TEMP/interop/MelonLoader/Il2CppAssemblies/UnityEngine.AudioModule.dll" 'UnityEngine.AudioModule.dll'
          copy_from "$TEMP/interop/MelonLoader/Il2CppAssemblies/UnityEngine.AssetBundleModule.dll" 'UnityEngine.AssetBundleModule.dll'

          echo 'References ready:'
          ls -lh "$REFS"/*.dll

      - name: Build Chainsaw DLL
        run: dotnet build 'Chainsaw BONELAB Code Mod/ChainsawCodeMod.csproj' -c Release

      - name: Verify DLL
        shell: bash
        run: |
          set -euo pipefail
          DLL=$(find 'Chainsaw BONELAB Code Mod/bin/Release' -type f -name 'ChainsawBONELABCodeMod.dll' -print -quit)
          test -n "$DLL"
          echo "Built: $DLL"
          ls -lh "$DLL"

      - name: Create Thunderstore package
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE="$RUNNER_TEMP/chainsaw-thunderstore"
          rm -rf "$PACKAGE"
          mkdir -p "$PACKAGE/Mods"

          DLL=$(find 'Chainsaw BONELAB Code Mod/bin/Release' -type f -name 'ChainsawBONELABCodeMod.dll' -print -quit)
          cp "$DLL" "$PACKAGE/Mods/ChainsawBONELABCodeMod.dll"
          cp 'Chainsaw BONELAB Code Mod/README.md' "$PACKAGE/README.md"

          VERSION=$(python3 - <<'PY'
          import re
          text = open('Chainsaw BONELAB Code Mod/Main.cs', encoding='utf-8').read()
          m = re.search(r'Chainsaw BONELAB Code Mod",\s*"([0-9]+\.[0-9]+\.[0-9]+)"', text)
          if not m:
              raise SystemExit('Could not find MelonInfo version in Main.cs')
          print(m.group(1))
          PY
          )

          cat > "$PACKAGE/manifest.json" <<EOF
          {
            "name": "Chainsaw_BONELAB_Code_Mod",
            "version_number": "$VERSION",
            "website_url": "https://github.com/papakermitsbambam2016-coder/UniversalVR-mod-menu",
            "description": "Quest-focused BONELAB chainsaw code mod with BoneMenu spawning and runtime chainsaw behavior.",
            "dependencies": [
              "bonelib-BoneLib-3.2.2"
            ]
          }
          EOF

          python3 - "$PACKAGE/icon.png" <<'PY'
          import struct, zlib, sys
          path = sys.argv[1]
          w = h = 256
          rows = []
          for y in range(h):
              row = bytearray([0])
              for x in range(w):
                  r, g, b, a = 24, 24, 28, 255
                  if 48 <= x <= 204 and 82 <= y <= 166:
                      r, g, b = 230, 106, 34
                  if 112 <= x <= 230 and 108 <= y <= 142:
                      r, g, b = 48, 48, 54
                  if 58 <= x <= 112 and 52 <= y <= 94:
                      r, g, b = 64, 64, 72
                  if 72 <= x <= 98 and 64 <= y <= 82:
                      r, g, b = 24, 24, 28
                  row.extend((r, g, b, a))
              rows.append(bytes(row))
          raw = b''.join(rows)
          def chunk(t, d):
              return struct.pack('>I', len(d)) + t + d + struct.pack('>I', zlib.crc32(t+d) & 0xffffffff)
          png = b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 6, 0, 0, 0)) + chunk(b'IDAT', zlib.compress(raw, 9)) + chunk(b'IEND', b'')
          open(path, 'wb').write(png)
          PY

          echo "Thunderstore package version: $VERSION"
          echo 'Package contents that will become the artifact ZIP root:'
          find "$PACKAGE" -maxdepth 2 -type f -print

          test -f "$PACKAGE/manifest.json"
          test -f "$PACKAGE/README.md"
          test -f "$PACKAGE/icon.png"
          test -f "$PACKAGE/Mods/ChainsawBONELABCodeMod.dll"

      - name: Upload Quest DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chainsaw-BONELAB-Code-Mod-Quest
          path: 'Chainsaw BONELAB Code Mod/bin/Release/**/ChainsawBONELABCodeMod.dll'
          if-no-files-found: error

      - name: Upload Thunderstore package artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chainsaw-BONELAB-Code-Mod-Thunderstore
          path: '${{ runner.temp }}/chainsaw-thunderstore/'
          if-no-files-found: error
